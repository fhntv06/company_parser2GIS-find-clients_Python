<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2GIS parser</title>
<style>
:root{--bg:#fff;--fg:#1c1f23;--mut:#6b7280;--line:#e5e7eb;--acc:#0b6bcb;--bad:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e6e8eb;--mut:#9aa3ad;--line:#2a2e35;--acc:#5aa9ff;--bad:#ff8a80;--ok:#6ee7a8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
nav{display:flex;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line)}
nav a{color:var(--mut);text-decoration:none}nav a.on{color:var(--fg);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.card b{display:block;font-size:22px}
.card span{color:var(--mut);font-size:13px}
textarea,input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
textarea{width:100%;min-height:90px}button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th a{color:inherit;text-decoration:none}.wrap{overflow-x:auto}
pre{background:rgba(127,127,127,.1);padding:10px;border-radius:6px;overflow:auto;max-height:340px;font-size:12.5px}
.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
</style></head><body>
<nav>
<a href="/" class="{{ 'on' if nav=='run' }}">Запуск</a>
<a href="/db" class="{{ 'on' if nav=='db' }}">База</a>
<a href="/jobs" class="{{ 'on' if nav=='jobs' }}">Задачи</a>
</nav><main>{% block body %}{% endblock %}</main></body></html>
